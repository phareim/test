[package]
name = "wgpu-test"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "image", "names"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document", "console"] }
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
